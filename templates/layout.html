<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NL2SQL Agent{% endblock %} — AI Database Assistant</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sora', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f4ff', 100: '#e0eaff', 200: '#c2d4ff', 300: '#93b4fd',
              400: '#6090f8', 500: '#3b6ef0', 600: '#2552d9', 700: '#1c3fb0',
              800: '#1a368f', 900: '#1a3171',
            },
            slate: { 850: '#172033', 950: '#0b1120' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Sora', sans-serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #3b6ef0; border-radius: 3px; }
    .glow-blue { box-shadow: 0 0 20px rgba(59,110,240,0.3); }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .animate-slide-in { animation: slideIn 0.3s ease forwards; }
    @keyframes pulse-dot {
      0%,80%,100% { transform:scale(0.6); opacity:0.4; }
      40%         { transform:scale(1);   opacity:1; }
    }
    .dot-pulse span {
      display:inline-block; width:8px; height:8px;
      border-radius:50%; background:#6090f8; margin:0 2px;
      animation:pulse-dot 1.2s infinite ease-in-out;
    }
    .dot-pulse span:nth-child(2) { animation-delay:0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay:0.4s; }
    .result-table th { background:#1e3a5f; color:#93b4fd; }
    .result-table tr:nth-child(even) { background:#1a2540; }
    .result-table tr:hover { background:#1e3060; }
    .badge-executed { background:#064e3b; color:#34d399; border:1px solid #065f46; }
    .badge-blocked  { background:#450a0a; color:#f87171; border:1px solid #7f1d1d; }
    .badge-allowed  { background:#1e3a5f; color:#60a5fa; border:1px solid #1d4ed8; }
    .badge-error    { background:#431407; color:#fb923c; border:1px solid #9a3412; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-950 text-slate-100 h-full min-h-screen">

  <!-- NAVBAR -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-screen-2xl mx-auto px-4 h-14 flex items-center justify-between">
    
      <!-- Logo -->
      <a href="/chat" class="flex items-center gap-2.5">
        <img src="static/Logo Telkomschool.PNG" alt="" class="rounded-md bg-white p-1 h-8">
        <!-- <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7C5 4 4 5 4 7zm4 0h8M8 12h8M8 16h5"/>
          </svg>
        </div> -->
        <div>
          <span class="font-bold text-white text-sm tracking-tight">NL2SQL</span>
          <span class="ml-1 text-brand-400 text-sm font-light">Agent</span>
        </div>
      </a>

      <!-- Nav Links -->
      <div class="hidden md:flex items-center gap-1">
        <a href="/chat" class="nav-link px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center gap-1.5">
          <i data-lucide="message-square" class="w-4 h-4"></i> Chat
        </a>
        <a href="/panduan" class="nav-link px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center gap-1.5">
          <i data-lucide="graduation-cap" class="w-4 h-4"></i> Panduan
        </a>
        {% if user and user.role == 'admin' %}
        <a href="/admin" class="nav-link px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center gap-1.5">
          <i data-lucide="shield" class="w-4 h-4"></i> Admin
        </a>
        {% endif %}
      </div>

      <!-- User Info -->
      <div class="flex items-center gap-3">
        {% if user %}
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-xs font-bold text-white">
            {{ user.name[0] | upper }}
          </div>
          <div class="hidden md:block text-right">
            <p class="text-xs font-semibold text-white leading-none">{{ user.name }}</p>
            <p class="text-xs text-slate-500 leading-none mt-0.5">
              <span class="{{ 'text-amber-400' if user.role == 'admin' else 'text-emerald-400' }}">
                {{ user.role | upper }}
              </span>
            </p>
          </div>
        </div>
        <a href="/logout" class="text-xs px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-all border border-slate-700">
          Logout
        </a>
        {% endif %}
      </div>

    </div>
  </nav>

  <!-- CONTENT -->
  <main class="pt-14">
    {% block content %}{% endblock %}
  </main>

  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
